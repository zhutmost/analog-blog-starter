  - date: "2026-08-03"
    type: "event"
    title: "The Great Hall welcomed its newest class"
    description: "Floating candles, long tables, and an unusually talkative Sorting Hat marked the start of term."
  - date: "2026-08-03"
    type: "event"
    title: "The new Inter-House Quidditch Cup schedule has been announced."
    description: "Four houses will compete throughout the autumn term, with the final match taking place in early December."
  - date: "2026-07-18"
    type: "project"
    title: "The Hogwarts Library has launched a catalogue of enchanted manuscripts."
    description: "The catalogue documents restricted spellbooks, self-revising maps, and several volumes that occasionally disappear."
  - date: "2026-06-27"
    type: "publication"
    title: "A new study of moving staircases appeared in the Journal of Experimental Charms."
    description: "The study examines route prediction, temporal instability, and the curious tendency of staircases to move before breakfast."
  - date: "2026-05-15"
    type: "talk"
    title: "Professor McGonagall delivered a lecture on applied Transfiguration."
    description: "The lecture covered reversible transformations, magical safety, and why teacups should not retain whiskers."
  - date: "2026-04-09"
    type: "award"
    title: "Ravenclaw received this year’s award for outstanding academic achievement."
    description: "The award recognizes consistently excellent work in Charms, Astronomy, and the study of ancient runes."
